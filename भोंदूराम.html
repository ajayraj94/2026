<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Master — Click any word</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fff; color: #222; padding: 8px 10px; }
  h1 { font-size: 14px; margin-bottom: 0; display: inline; }
  .sub { color: #666; font-size: 11px; margin-bottom: 6px; display: inline; margin-left: 8px; }
  #search {
    width: 100%; max-width: 300px; padding: 4px 12px; font-size: 13px;
    border: 1.5px solid #ddd; border-radius: 16px; outline: none; margin: 8px 0 6px; display: block;
  }
  #search:focus { border-color: #7c4dff; }
  .chips { display: flex; flex-wrap: wrap; gap: 0 4px; align-items: center; }
  .chip {
    display: inline-flex; align-items: center;
    background: none; border: none; cursor: pointer;
    font-size: 14.5px; padding: 0; color: inherit; font-family: inherit;
  }
  .chip:hover .label { text-decoration: underline; }
  .label { line-height: 1.35; padding: 0 4px; border: 1px solid transparent; border-radius: 6px; }
  .chip.open { outline: none; }
  .chip.open .label { border-color: #b39ddb; background: #faf8ff; }
  /* Mastery marks */
  .label.m-weak { background: #ffe1e1; border-color: #ffb0b0; }
  .label.m-done { background: #d9f2e2; border-color: #a5d6a7; opacity: .55; text-decoration: line-through; }
  /* Mastery filter bar */
  #masterybar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 0 0 6px; }
  .mbtn {
    border: 1.5px solid #e0e0e0; background: #fff; border-radius: 14px;
    font-size: 12px; padding: 2px 10px; cursor: pointer; font-family: inherit; color: #444;
  }
  .mbtn.active { border-color: #7c4dff; background: #f3ecff; color: #4a148c; }
  .mbtn .n { font-weight: 700; }
  #reset { border: none; background: none; color: #bbb; font-size: 11px; cursor: pointer; font-family: inherit; text-decoration: underline; }
  /* Popup mastery buttons */
  #p-actions { display: flex; gap: 8px; margin-top: 12px; }
  .pbtn { flex: 1; border: 1.5px solid #e0e0e0; background: #fff; border-radius: 8px; padding: 5px 4px; cursor: pointer; font-size: 12.5px; font-family: inherit; color: #444; }
  .pbtn.p-weak.active { background: #ffe1e1; border-color: #e57373; }
  .pbtn.p-learn.active { background: #f0f0f0; border-color: #9e9e9e; }
  .pbtn.p-done.active { background: #d9f2e2; border-color: #66bb6a; }
  /* Popup */
  #popup {
    position: fixed; z-index: 100; max-width: 380px; width: min(92vw, 380px);
    background: #fff; border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,.22); border: 1px solid #eee;
    display: none; font-size: 14px;
  }
  #popup.show { display: block; animation: pop .16s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  #popup .pw { font-size: 19px; font-weight: 700; color: var(--pc, #e63980); }
  #popup .close {
    position: absolute; top: 8px; right: 12px; border: none; background: none;
    font-size: 20px; cursor: pointer; color: #999; line-height: 1;
  }
  #popup .hi { font-size: 16px; font-weight: 600; margin-top: 2px; }
  #popup .en { color: #555; margin-top: 4px; }
  #popup .trick { background: #fff8e1; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 13px; }
  #popup .sent { margin-top: 8px; font-size: 13px; line-height: 1.5; }
  #popup .sent .en-s { display: block; }
  #popup .sent .hi-s { color: #777; display: block; }
  #popup .loc { margin-top: 10px; font-size: 11px; color: #aaa; }
  #overlay { position: fixed; inset: 0; z-index: 90; display: none; }
  #overlay.show { display: block; }
  #count { color: #888; font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
<h1>Vocabulary Master</h1>
<div class="sub">~440 words · Click any word for meaning · set 🔴/✅ mastery in popup (auto-save)</div>
<div id="masterybar">
  <button class="mbtn active" data-f="all">All <span class="n" id="n-all"></span></button>
  <button class="mbtn" data-f="weak">🔴 Weak <span class="n" id="n-weak"></span></button>
  <button class="mbtn" data-f="learn">⚪ Learning <span class="n" id="n-learn"></span></button>
  <button class="mbtn" data-f="done">✅ Mastered <span class="n" id="n-done"></span></button>
  <button id="reset">reset</button>
</div>
<input id="search" type="text" placeholder="Search word… (type & click)" autocomplete="off">
<div class="chips" id="chips"></div>
<div id="count"></div>

<div id="overlay"></div>
<div id="popup" role="dialog">
  <button class="close" onclick="closePop()">✕</button>
  <div class="pw" id="p-word"></div>
  <div class="hi" id="p-hi"></div>
  <div class="en" id="p-en"></div>
  <div class="trick" id="p-trick"></div>
  <div class="sent" id="p-sent"></div>
  <div id="p-actions">
    <button class="pbtn p-weak" onclick="markFromPop('weak')">🔴 Weak</button>
    <button class="pbtn p-learn" onclick="markFromPop('learn')">⚪ Learning</button>
    <button class="pbtn p-done" onclick="markFromPop('done')">✅ Mastered</button>
  </div>
  <div class="loc" id="p-loc"></div>
</div>

<script>
const DATA = [{"w":"Thwart","hi":"विफल करना","en":"stop a plan from succeeding","t":"THWART = \"THE-WART\": दाना चेहरे की खूबसूरती रोकता है → plan रोकना.","s":[{"en":"The rain thwarted our picnic.","hi":"बारिश ने हमारी पिकनिक विफल कर दी।"}],"loc":"Section 1 · Column 1 · #1","c":"#e63980"},{"w":"Appal","hi":"चौंका देना","en":"shock, horrify","t":"AAP + PAL: अपना (AAP) दोस्त (PAL) गलत काम करे तो चौंक जाओ.","s":[{"en":"The cruelty appalled the judge.","hi":"क्रूरता ने जज को स्तब्ध कर दिया।"}],"loc":"Section 1 · Column 1 · #2","c":"#7c4dff"},{"w":"Resent","hi":"नाराज़ होना","en":"feel bitter about something","t":"RE-SENT: गुस्से में message बार-बार RE-SEND किया = बितर (bitterness).","s":[{"en":"She resents being ignored.","hi":"वह अनदेखा किए जाने से नाराज़ है।"}],"loc":"Section 1 · Column 1 · #3","c":"#00897b"},{"w":"Precocious","hi":"समय से पहले विकसित","en":"unusually advanced for age","t":"PRE + COCO: छोटा बच्चा coco (कॉफी) जल्दी पीने लगे = उम्र से आगे.","s":[{"en":"The precocious child read at age three.","hi":"समय से आगे बढ़ा बच्चा तीन साल में पढ़ने लगा।"}],"loc":"Section 1 · Column 1 · #4","c":"#ef6c00"},{"w":"Profane","hi":"अपवित्र","en":"disrespectful to religion","t":"PRO + FANE (\"fane\" = मंदिर): मंदिर के खिलाफ = अपवित्र.","s":[{"en":"He used profane language in the temple.","hi":"उसने मंदिर में अपवित्र भाषा बोली।"}],"loc":"Section 1 · Column 1 · #5","c":"#3949ab"},{"w":"Maniacal","hi":"पागलपन भरा","en":"wild, crazy","t":"MANIAC + AL: पागल (maniac) जैसी हँसी/हरकत.","s":[{"en":"He gave a maniacal laugh.","hi":"वह पागलपन भरी हँसी हँसा।"}],"loc":"Section 1 · Column 1 · #6","c":"#c62828"},{"w":"Rubble","hi":"मलबा","en":"broken pieces of a building","t":"RUB + BLE: मलबे से हाथ RUB (रगड़) कर साफ करना पड़ता है.","s":[{"en":"The earthquake left only rubble.","hi":"भूकंप ने केवल मलबा छोड़ा।"}],"loc":"Section 1 · Column 1 · #7","c":"#2e7d32"},{"w":"Vain","hi":"व्यर्थ / खुद पर मोहित","en":"useless; too proud of looks","t":"VAIN = mirror के आगे खड़ा \"वेन\" — दोनों अर्थ: शीशा (आत्ममुग्ध) + व्यर्थ.","s":[{"en":"All his efforts were in vain.","hi":"उसकी सारी मेहनत व्यर्थ गई।"}],"loc":"Section 1 · Column 1 · #8","c":"#6d4c41"},{"w":"Siege","hi":"घेराबंदी","en":"surrounding a place to capture it","t":"SIEGE ≈ SEIZE: किले को घेरकर SEIZE (कब्जा) करना.","s":[{"en":"The army laid siege to the fort.","hi":"सेना ने किले की घेराबंदी की।"}],"loc":"Section 1 · Column 1 · #9","c":"#e63980"},{"w":"Trance","hi":"सम्मोहन अवस्था","en":"half-conscious dreamy state","t":"TRANCE ≈ ENTRANCE: जादू \"entrance\" करके trance में डाल दे.","s":[{"en":"The magician put him in a trance.","hi":"जादूगर ने उसे सम्मोहन में डाल दिया।"}],"loc":"Section 1 · Column 1 · #10","c":"#7c4dff"},{"w":"Deference","hi":"आदर","en":"respectful submission","t":"DEFER = आगे बढ़ने से रुकना: बड़ों की बात टालकर झुकना = आदर.","s":[{"en":"He bowed in deference to his teacher.","hi":"उसने शिक्षक के आदर में सिर झुकाया।"}],"loc":"Section 1 · Column 1 · #11","c":"#00897b"},{"w":"Inference","hi":"अनुमान","en":"conclusion from evidence","t":"INFER + ENCE: जो आप INFER (निकालें) वही अनुमान.","s":[{"en":"His inference proved correct.","hi":"उसका अनुमान सही निकला।"}],"loc":"Section 1 · Column 1 · #12","c":"#ef6c00"},{"w":"Exquisite","hi":"अत्यंत सुंदर","en":"extremely beautiful, delicate","t":"EXTRA + SUITE: होटल का extra-खूबसूरत सुइट.","s":[{"en":"She wore an exquisite saree.","hi":"उसने अत्यंत सुंदर साड़ी पहनी।"}],"loc":"Section 1 · Column 1 · #13","c":"#3949ab"},{"w":"Indolent","hi":"आलसी","en":"lazy","t":"IDLE + LENT: \"आइडल\" (खाली) बैठा रहना = आलस.","s":[{"en":"The indolent student failed.","hi":"आलसी छात्र फेल हो गया।"}],"loc":"Section 1 · Column 1 · #14","c":"#c62828"},{"w":"Glutted","hi":"अत्यधिक भरा हुआ","en":"overfilled, oversupplied","t":"GLUT ≈ \"गट\" (gut): पेट गट-भर भर गया.","s":[{"en":"The market is glutted with cheap toys.","hi":"बाज़ार सस्ते खिलौनों से भरा पड़ा है।"}],"loc":"Section 1 · Column 1 · #15","c":"#2e7d32"},{"w":"Succumb","hi":"झुक जाना / दम तोड़ना","en":"fail to resist; die of","t":"SUCCUMB = \"SUCK + UMBRELLA\": तूफान छाता उड़ा ले गया — हार मान ली.","s":[{"en":"He succumbed to his injuries.","hi":"चोटों के आगे वह झुक गया (उसकी मृत्यु हुई)।"}],"loc":"Section 1 · Column 1 · #16","c":"#6d4c41"},{"w":"Impetuous","hi":"जल्दबाज़","en":"acting fast without thinking","t":"IMPETUS (झटका/force): झटके में फैसला = जल्दबाज़ी.","s":[{"en":"It was impetuous to quit in anger.","hi":"गुस्से में इस्तीफ़ा देना जल्दबाज़ी थी।"}],"loc":"Section 1 · Column 1 · #17","c":"#e63980"},{"w":"Latter","hi":"दूसरा / उत्तरार्ध","en":"the second of two","t":"LaTTer = lisT का बाद वाला (TT = Two things).","s":[{"en":"Of tea and coffee, I prefer the latter.","hi":"चाय-कॉफी में मुझे दूसरा (कॉफी) पसंद है।"}],"loc":"Section 1 · Column 1 · #18","c":"#7c4dff"},{"w":"Retinue","hi":"अनुचर दल","en":"group of attendants","t":"RETINUE ≈ RETAIN: जो सेवक RETAIN (रखे) जाएँ, वही दल.","s":[{"en":"The king moved with a large retinue.","hi":"राजा बड़े अनुचर दल के साथ चला।"}],"loc":"Section 1 · Column 1 · #19","c":"#00897b"},{"w":"Flummoxed","hi":"असमंजस में","en":"totally confused","t":"FULL + MOCKS: पूरे mocks (टेस्ट) के बाद सिर घूम जाए = भ्रमित.","s":[{"en":"I was flummoxed by the puzzle.","hi":"पहेली ने मुझे असमंजस में डाल दिया।"}],"loc":"Section 1 · Column 1 · #20","c":"#ef6c00"},{"w":"Clamour","hi":"शोरगुल","en":"loud noise or demand","t":"CLAIM + OUR: भीड़ चिल्लाती है \"यह OUR हक CLAIM है!\"","s":[{"en":"The clamour of the crowd grew.","hi":"भीड़ का शोरगुल बढ़ गया।"}],"loc":"Section 1 · Column 1 · #21","c":"#3949ab"},{"w":"Babble","hi":"बड़बड़ाना","en":"talk without meaning","t":"\"बा-बा-बा\" — शिशु की आवाज़.","s":[{"en":"The baby babbled happily.","hi":"शिशु खुशी से बड़बड़ाया।"}],"loc":"Section 1 · Column 1 · #22","c":"#c62828"},{"w":"Impotence","hi":"शक्तिहीनता","en":"powerlessness","t":"IM (नहीं) + POTENT (शक्तिशाली) = बेबसी.","s":[{"en":"The committee's impotence angered people.","hi":"समिति की बेबसी से लोग गुस्सा हुए।"}],"loc":"Section 1 · Column 1 · #23","c":"#2e7d32"},{"w":"Impudent","hi":"धृष्ट","en":"shamelessly rude","t":"IMP (शैतान बच्चा) + DENT: शैतान ने आदर में \"dent\" (खोद) दी.","s":[{"en":"The impudent boy talked back.","hi":"धृष्ट लड़के ने जवाब दे दिया।"}],"loc":"Section 1 · Column 1 · #24","c":"#6d4c41"},{"w":"Fallacy","hi":"भ्रांति","en":"false belief; faulty logic","t":"FALL + ACY: तर्क FALL (गिर) जाए = तर्कदोष.","s":[{"en":"That superstition is a fallacy.","hi":"वह अंधविश्वास एक भ्रांति है।"}],"loc":"Section 1 · Column 1 · #25","c":"#e63980"},{"w":"Flex","hi":"मोड़ना / अड़ाना","en":"bend muscles; show off","t":"GYM में biceps FLEX करना = दिखावा.","s":[{"en":"He flexed his biceps.","hi":"उसने बाहें मोड़ीं (फ्लेक्स कीं)।"}],"loc":"Section 1 · Column 1 · #26","c":"#7c4dff"},{"w":"Nibble","hi":"कुतरना","en":"eat in small bites","t":"चूहे की तरह NIB-NIB छोटे कौर.","s":[{"en":"She nibbled the biscuit.","hi":"उसने बिस्कुट कुतरा।"}],"loc":"Section 1 · Column 1 · #27","c":"#00897b"},{"w":"Gobble","hi":"निगल जाना","en":"eat fast and hungrily","t":"टर्की \"गोबल-गोबल\" कहकर खाना तेज़ी से निगलती है.","s":[{"en":"He gobbled down his lunch.","hi":"उसने खाना गटक दिया।"}],"loc":"Section 1 · Column 1 · #28","c":"#ef6c00"},{"w":"Muzzle","hi":"मुहरा / थूथन","en":"mouth cover for animal; gun mouth","t":"MUZZLE मुँह (MOUTH) ढकता है — \"मुँह बंद!\"","s":[{"en":"Put a muzzle on the dog.","hi":"कुत्ते पर मुहरा लगाओ।"}],"loc":"Section 1 · Column 2 · #29","c":"#3949ab"},{"w":"Sprint","hi":"तेज़ दौड़","en":"run at full speed","t":"SPRINT = SPeeD + RUN + TIME = फटाफट दौड़.","s":[{"en":"He sprinted for the bus.","hi":"वह बस के लिए तेज़ दौड़ा।"}],"loc":"Section 1 · Column 2 · #30","c":"#c62828"},{"w":"Indecent","hi":"अश्लील / अनुचित","en":"offensive to modesty","t":"IN + DECENT = DECENT (शालीन) नहीं.","s":[{"en":"Indecent jokes are not allowed.","hi":"अश्लील मज़ाक मना है।"}],"loc":"Section 1 · Column 2 · #31","c":"#2e7d32"},{"w":"Weary","hi":"थका हुआ","en":"very tired","t":"WEAR: कपड़े की तरह थकान से \"wear out\" हो जाना.","s":[{"en":"After the trek he was weary.","hi":"लंबी यात्रा बाद वह थक गया।"}],"loc":"Section 1 · Column 2 · #32","c":"#6d4c41"},{"w":"Ramble","hi":"भटकना / बिना-सिरे की बातें","en":"wander or talk aimlessly","t":"RAMBLE ≈ ROAM: ज़बान ROAM (घूमती) रहे = बकबक.","s":[{"en":"Grandpa rambles about old days.","hi":"दादाजी पुरानी बातें बिना सिरे की करते हैं।"}],"loc":"Section 1 · Column 2 · #33","c":"#e63980"},{"w":"Prosecution","hi":"अभियोजन","en":"legal action against accused","t":"PRO + SECUTE: अदालत में PROVE करना कि अपराधी है.","s":[{"en":"The prosecution presented evidence.","hi":"अभियोजन ने सबूत पेश किए।"}],"loc":"Section 1 · Column 2 · #34","c":"#7c4dff"},{"w":"Debile","hi":"कमज़ोर","en":"weak, feeble","t":"DEBILITY (कमज़ोरी) से — DEBILE = दुर्बल.","s":[{"en":"The debile old man walked slowly.","hi":"कमज़ोर बुज़ुर्ग धीरे चला।"}],"loc":"Section 1 · Column 2 · #35","c":"#00897b"},{"w":"Squalid","hi":"गंदा-मैला","en":"filthy, miserable","t":"SQUALOR (गंदगी) से — SQUALID = मैला-कुचैला.","s":[{"en":"They lived in a squalid hut.","hi":"वे गंदी झोपड़ी में रहते थे।"}],"loc":"Section 1 · Column 2 · #36","c":"#ef6c00"},{"w":"Contemptuous","hi":"तिरस्कारपूर्ण","en":"showing contempt (deep dislike)","t":"CONTEMPT ≈ \"कंटेंट नहीं\" — घृणा भरा रवैया.","s":[{"en":"He gave a contemptuous laugh.","hi":"उसने घृणा भरी हँसी हँसी।"}],"loc":"Section 1 · Column 2 · #37","c":"#3949ab"},{"w":"Cease","hi":"रुकना","en":"stop","t":"CEASEFIRE = युद्ध CEASE (रुकना).","s":[{"en":"The rain ceased at noon.","hi":"दोपहर में बारिश रुक गई।"}],"loc":"Section 1 · Column 2 · #38","c":"#c62828"},{"w":"Usher","hi":"सूत्रधार / मार्गदर्शक","en":"person who guides to seats","t":"\"YOU-SHER\": आपको (YOU) अंदर ले जाने वाला शेरपा.","s":[{"en":"The usher showed us our seats.","hi":"सूत्रधार ने हमें सीट दिखाई।"}],"loc":"Section 1 · Column 2 · #39","c":"#2e7d32"},{"w":"Inquisitive","hi":"जिज्ञासु","en":"curious, always asking","t":"INQUIRY = जाँच-पड़ताल — सवालों की झड़ी लगाने वाला.","s":[{"en":"Children are inquisitive by nature.","hi" const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const popup = document.getElementById('popup');
const overlay = document.getElementById('overlay');
let openChip = null;
let curWord = null;
let curFilter = 'all';

// ---- Mastery tracking (auto-saved in browser) ----
const LS_KEY = 'vocabMasteryV1';
let mastery = {};
try { mastery = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { mastery = {}; }
function saveMastery() { try { localStorage.setItem(LS_KEY, JSON.stringify(mastery)); } catch (e) {} }
function mClass(w) { const s = mastery[w]; return s === 'weak' ? 'm-weak' : (s === 'done' ? 'm-done' : ''); }
function chipMatchesFilter(d) {
  if (curFilter === 'weak' && mastery[d.w] !== 'weak') return false;
  if (curFilter === 'done' && mastery[d.w] !== 'done') return false;
  if (curFilter === 'learn' && mastery[d.w]) return false;
  return true;
}
function nEl(id) { return document.getElementById(id); }
function updateCounts() {
  let weak = 0, done = 0;
  DATA.forEach(d => { if (mastery[d.w] === 'weak') weak++; else if (mastery[d.w] === 'done') done++; });
  nEl('n-weak').textContent = weak;
  nEl('n-done').textContent = done;
  nEl('n-learn').textContent = DATA.length - weak - done;
  nEl('n-all').textContent = DATA.length;
}

function render() {
  chipsEl.innerHTML = '';
  const f = (searchEl.value || '').trim().toLowerCase();
  let shown = 0;
  DATA.forEach((d, i) => {
    if (f && !d.w.toLowerCase().includes(f) && !d.hi.includes(f)) return;
    if (!chipMatchesFilter(d)) return;
    shown++;
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.dataset.idx = i;
    const mc = mClass(d.w);
    btn.innerHTML = '<span class="label' + (mc ? ' ' + mc : '') + '" style="color:' + d.c + '">' + d.w + '</span>';
    btn.addEventListener('click', e => { e.stopPropagation(); togglePop(btn, d); });
    chipsEl.appendChild(btn);
  });
  countEl.textContent = shown + ' / ' + DATA.length + ' words' + ((f || curFilter !== 'all') ? ' (filtered)' : '');
  updateCounts();
}

function markFromPop(state) {
  if (!curWord) return;
  if (state === 'learn') delete mastery[curWord]; else mastery[curWord] = state;
  saveMastery();
  document.querySelectorAll('#chips .chip').forEach(ch => {
    const d = DATA[ch.dataset.idx];
    if (d.w !== curWord) return;
    if (!chipMatchesFilter(d)) { ch.style.display = 'none'; return; }
    ch.style.display = '';
    const lbl = ch.querySelector('.label');
    lbl.classList.remove('m-weak', 'm-done');
    const mc = mClass(curWord); if (mc) lbl.classList.add(mc);
  });
  let vis = 0;
  document.querySelectorAll('#chips .chip').forEach(ch => { if (ch.style.display !== 'none') vis++; });
  countEl.textContent = vis + ' / ' + DATA.length + ' words' + ((searchEl.value.trim() || curFilter !== 'all') ? ' (filtered)' : '');
  updateCounts();
  syncPopButtons();
}
function syncPopButtons() {
  const s = mastery[curWord] || 'learn';
  document.querySelector('.p-weak').classList.toggle('active', s === 'weak');
  document.querySelector('.p-learn').classList.toggle('active', s === 'learn');
  document.querySelector('.p-done').classList.toggle('active', s === 'done');
}

function togglePop(chipEl, d) {
  if (openChip === chipEl) { closePop(); return; }
  if (openChip) openChip.classList.remove('open');
  openChip = chipEl;
  chipEl.classList.add('open');

  popup.style.setProperty('--pc', d.c);
  document.getElementById('p-word').textContent = d.w;
  document.getElementById('p-hi').textContent = d.hi;
  document.getElementById('p-en').textContent = d.en;
  document.getElementById('p-trick').textContent = d.t ? '🧠 ' + d.t : '';
  document.getElementById('p-trick').style.display = d.t ? 'block' : 'none';
  const sEl = document.getElementById('p-sent');
  sEl.innerHTML = '';
  (d.s || []).forEach(s => {
    const e = document.createElement('span'); e.className = 'en-s'; e.textContent = '🗣️ ' + s.en; sEl.appendChild(e);
    if (s.hi) { const h = document.createElement('span'); h.className = 'hi-s'; h.textContent = s.hi; sEl.appendChild(h); }
  });
  sEl.style.display = (d.s && d.s.length) ? 'block' : 'none';
  document.getElementById('p-loc').textContent = d.loc;
  curWord = d.w;
  syncPopButtons();
  popup.classList.add('show');
  overlay.classList.add('show');
  positionPop(chipEl);
}

function positionPop(chipEl) {
  const r = chipEl.getBoundingClientRect();
  const pw = popup.offsetWidth, ph = popup.offsetHeight;
  let left = r.left;
  let top = r.bottom + 8;
  if (left + pw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - pw - 8);
  if (top + ph > window.innerHeight - 8) {
    top = r.top - ph - 8;                 // flip above
    if (top < 8) { top = 8; }             // fallback: near top
  }
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function closePop() {
  popup.classList.remove('show');
  overlay.classList.remove('show');
  if (openChip) { openChip.classList.remove('open'); openChip = null; }
}

overlay.addEventListener('click', closePop);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('resize', () => { if (openChip) positionPop(openChip); });

searchEl.addEventListener('input', () => render());
document.querySelectorAll('.mbtn').forEach(b => b.addEventListener('click', () => {
  curFilter = b.dataset.f;
  document.querySelectorAll('.mbtn').forEach(x => x.classList.toggle('active', x === b));
  render();
}));
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Clear all Weak/Mastered marks?')) return;
  mastery = {};
  saveMastery();
  render();
});
render();
</script>
</body>
</html>
